name: CI
on:
  push:
  pull_request:
jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: flake-check
            command: nix flake check
          - name: static-analysis
            command: nix run nixpkgs#statix -- check . && nix run nixpkgs#deadnix -- --fail .
          - name: darwin-eval
            command: nix eval --raw .#darwinConfigurations.MacBook-Pro.config.system.build.toplevel.drvPath
          - name: nixos-eval
            command: nix eval --raw .#nixosConfigurations.nixos.config.system.build.toplevel.drvPath
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}
