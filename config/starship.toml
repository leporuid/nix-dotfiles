command_timeout = 1000
add_newline = false
continuation_prompt = "[▸▹ ](dimmed white)"
palette = "soft_neon_violet"

[palettes.soft_neon_violet]
background = "#170032"
deep = "#3F0474"
pink = "#C026D3"
violet = "#A855F7"
lavender = "#C9A7D8"
text = "#EAD7FF"
bright = "#F8EEFF"
muted = "#A06E86"
subtle = "#8176B8"
red = "#B96F91"
green = "#91AE9A"
yellow = "#C8AB86"
blue = "#8176B8"
cyan = "#8FA5B9"

format = """($nix_shell$container$fill$git_metrics$hostname)\n
$sudo\
$character
"""

# move the rest of the prompt to the right
right_format = """$all"""

[fill]
symbol = ' '

[character]
format = "$symbol "
success_symbol = "[◎](bold italic pink)"
error_symbol = "[⊘](italic red)"
vimcmd_symbol = "[■](italic green)"
# not supported in zsh
vimcmd_replace_one_symbol = "◌"
vimcmd_replace_symbol = "□"
vimcmd_visual_symbol = "▼"

[env_var.VIMSHELL]
format = "[$env_value]($style)"
style = 'green italic'

[sudo]
format = "[$symbol]($style)"
style = "bold italic pink"
symbol = "⋈┈"
disabled = false

[username]
style_user = "bright-yellow bold italic"
style_root = "purple bold italic"
format = "[⭘ $user]($style) "
disabled = true
show_always = false

[hostname]
format = "[ $ssh_symbol]($style)"
ssh_symbol = ""

[directory]
home_symbol = "⌂"
#home_symbol = "󰋞"
truncation_length = 3
fish_style_pwd_dir_length = 1                                                                                                                               # turn on fish directory truncation
truncation_symbol = "□ "
read_only = " ◈"
read_only_style = "subtle"
use_os_path_sep = true
style = "italic violet"
format = '[$path]($style)[$read_only]($read_only_style)'
repo_root_style = 'bold lavender'
repo_root_format = '[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) [△](bold pink)'

[directory.substitutions]
'/opt/homebrew' = ""
'~' = "󰋞"
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "
'iCloud Drive' = "󰀸"

[cmd_duration]
format = "[◄ $duration ](italic muted)"
min_time = 2000
show_milliseconds = false
disabled = false

[jobs]
format = "[$symbol$number]($style) "
style = "muted"
symbol = "[▶](violet italic)"

[localip]
ssh_only = true
format = " ◯[$localipv4](bold magenta)"
disabled = true

[time]
disabled = true
format = "[ $time]($style)"
time_format = "%R"
utc_time_offset = "local"
style = "italic dimmed white"

[battery]
format = "[ $percentage $symbol]($style)"
full_symbol = "█"
charging_symbol = "[↑](italic bold green)"
discharging_symbol = "↓"
unknown_symbol = "░"
empty_symbol = "▃"

[[battery.display]]
threshold = 20
style = "italic bold red"

[[battery.display]]
threshold = 60
style = "italic dimmed bright-purple"

[[battery.display]]
threshold = 70
style = "italic dimmed yellow"

[git_branch]
format = " [$symbol$branch(:$remote_branch)]($style)"
symbol = "[△](bold italic pink)"
style = "italic violet"
truncation_symbol = "⋯"
truncation_length = 15
ignore_branches = ["main", "master"]
only_attached = true

[git_metrics]
format = '([▴$added]($added_style))([▿$deleted]($deleted_style))'
added_style = 'italic green'
deleted_style = 'italic pink'
ignore_submodules = true
disabled = false

[git_status]
style = "bold italic lavender"
format = "([⎪$ahead_behind$staged$modified$untracked$renamed$deleted$conflicted$stashed⎥]($style))"
conflicted = "[◪◦](italic pink)"
ahead = "[▴│[${count}](bold bright)│](italic green)"
behind = "[▿│[${count}](bold bright)│](italic pink)"
diverged = "[◇ ▴┤[${ahead_count}](regular bright)│▿┤[${behind_count}](regular bright)│](italic pink)"
untracked = "[◌◦](italic violet)"
stashed = "[◃◈](italic muted)"
modified = "[●◦](italic yellow)"
staged = "[▪┤[${count}](bold bright)│](italic violet)"
renamed = "[◎◦](italic blue)"
deleted = "[✕](italic red)"

[deno]
format = " [deno](italic) [ $version](violet bold)"
version_format = "${raw}"

[lua]
format = " [lua](italic) [${symbol}${version}]($style)"
version_format = "${raw}"
symbol = " "
style = "bold violet"

[nodejs]
format = " [󰎙 (italic)](bold bright-green)"
version_format = "${raw}"
detect_files = ["package-lock.json", "yarn.lock"]
detect_folders = ["node_modules"]
detect_extensions = []
disabled = true

[python]
format = " [py](italic) [${symbol}${version}]($style)"
symbol = "[⌉](bold bright-blue)⌊ "
version_format = "${raw}"
style = "bold violet"

[ruby]
format = " [rb](italic) [${symbol}${version}]($style)"
symbol = "◆ "
version_format = "${raw}"
style = "bold pink"

[rust]
format = " [rs](italic) [$symbol$version]($style)"
symbol = " "
version_format = "${raw}"
style = "bold violet"

[package]
format = " [pkg](italic dimmed) [$symbol$version]($style)"
version_format = "${raw}"
symbol = "󰏖 "
style = "bold muted"

[swift]
format = " [sw](italic) [${symbol}${version}]($style)"
symbol = " "
style = "bold pink"
version_format = "${raw}"

[aws]
disabled = true
format = " [aws](italic) [$symbol $profile $region]($style)"
style = "bold blue"
symbol = "▲ "

[buf]
symbol = "■ "
format = " [buf](italic) [$symbol $version $buf_version]($style)"

[c]
symbol = "ℂ "
format = " [$symbol($version(-$name))]($style)"

[cpp]
symbol = "ℂ "
format = " [$symbol($version(-$name))]($style)"

[conda]
symbol = "◯ "
format = " conda [$symbol$environment]($style)"

[pixi]
symbol = "■ "
format = " pixi [$symbol$version ($environment )]($style)"

[dart]
#symbol = "◁◅ "
symbol = " "
format = " dart [$symbol($version )]($style)"

[docker_context]
symbol = "◧ "
format = " docker [$symbol$context]($style)"

[elixir]
symbol = "△ "
format = " exs [$symbol $version OTP $otp_version ]($style)"

[elm]
#symbol = "◩ "
symbol = " "
format = " elm [$symbol($version )]($style)"

[golang]
#symbol = "∩ "
symbol = " "
style = "bold lavender"
format = " go [$symbol($version )]($style)"

[haskell]
#symbol = "❯λ "
symbol = " "
format = " hs [$symbol($version )]($style)"

[java]
#symbol = "∪ "
symbol = ""
format = " java [${symbol}(${version} )]($style)"

[julia]
#symbol = "◎ "
symbol = " "
format = " jl [$symbol($version )]($style)"

[memory_usage]
symbol = "▪▫▪ "
format = " mem [${ram}( ${swap})]($style)"

[nim]
#symbol = "▴▲▴ "
symbol = " "
format = " nim [$symbol($version )]($style)"

[nix_shell]
style = 'bold italic violet'
symbol = '✶'
format = '[$symbol⎪$state⎪]($style) [$name](italic muted) '
impure_msg = '[⌽](bold pink)'
pure_msg = '[⌾](bold green)'
unknown_msg = '[◌](bold muted)'

[spack]
#symbol = "◇ "
symbol = " "
format = " spack [$symbol$environment]($style)"

[profiles]
transient = """($nix_shell$container$fill$git_metrics$cmd_duration)\n
$sudo\
$character
"""
path = """
$directory
"""
