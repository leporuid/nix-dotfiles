"$schema" = 'https://starship.rs/config-schema.json'

command_timeout = 1000
add_newline = false
continuation_prompt = "[▸▹ ](dimmed white)"
palette = "catppuccin_mocha"

format = """($nix_shell$container$hostname\n)\
$sudo\
$character"""

# move the rest of the prompt to the right
right_format = """$all"""

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"

[fill]
symbol = ' '

[character]
format = "$symbol "
success_symbol = "[◎](bold italic yellow)"
error_symbol = "[⊘](italic red)"
vimcmd_symbol = "[■](italic green)"
# not supported in zsh
vimcmd_replace_one_symbol = "◌"
vimcmd_replace_symbol = "□"
vimcmd_visual_symbol = "▼"

[env_var.VIMSHELL]
format = "[$env_value]($style)"
style = 'green italic'

[sudo]
format = "[$symbol]($style)"
style = "bold italic mauve"
symbol = "⋈┈"
disabled = false

[username]
style_user = "yellow bold italic"
style_root = "mauve bold italic"
format = "[⭘ $user]($style) "
disabled = true
show_always = false

[hostname]
format = "[ $ssh_symbol]($style)"
ssh_symbol = ""

[directory]
home_symbol = "⌂"
#home_symbol = "󰋞"
truncation_length = 3
fish_style_pwd_dir_length = 1                                                                                                                                   # turn on fish directory truncation
truncation_symbol = "□ "
read_only = " ◈"
read_only_style = "subtext0"
use_os_path_sep = true
style = "italic blue"
format = '[$path]($style)[$read_only]($read_only_style)'
repo_root_style = 'bold lavender'
repo_root_format = '[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) [△](bold sapphire)'

[directory.substitutions]
'/opt/homebrew' = ""
'~' = "󰋞"
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "
'iCloud Drive' = "󰀸"

[cmd_duration]
format = "[◄ $duration ](italic subtext0)"
min_time = 2000
show_milliseconds = false
disabled = false

[jobs]
format = "[$symbol$number]($style) "
style = "text"
symbol = "[▶](blue italic)"

[localip]
ssh_only = true
format = " ◯[$localipv4](bold pink)"
disabled = true

[time]
disabled = true
format = "[ $time]($style)"
time_format = "%R"
utc_time_offset = "local"
style = "italic subtext0"

[battery]
format = "[ $percentage $symbol]($style)"
full_symbol = "█"
charging_symbol = "[↑](italic bold green)"
discharging_symbol = "↓"
unknown_symbol = "░"
empty_symbol = "▃"

[[battery.display]]
threshold = 20
style = "italic bold red"

[[battery.display]]
threshold = 60
style = "italic mauve"

[[battery.display]]
threshold = 70
style = "italic yellow"

[git_branch]
format = " [$symbol$branch(:$remote_branch)]($style)"
symbol = "[△](bold italic sapphire)"
style = "italic sapphire"
truncation_symbol = "⋯"
truncation_length = 15
ignore_branches = ["main", "master"]
only_attached = true

[git_metrics]
format = '([▴$added]($added_style))([▿$deleted]($deleted_style))'
added_style = 'italic green'
deleted_style = 'italic red'
ignore_submodules = true
disabled = false

[git_status]
style = "bold italic lavender"
format = "([⎪$ahead_behind$staged$modified$untracked$renamed$deleted$conflicted$stashed⎥]($style))"
conflicted = "[◪◦](italic pink)"
ahead = "[▴│[${count}](bold text)│](italic green)"
behind = "[▿│[${count}](bold text)│](italic red)"
diverged = "[◇ ▴┤[${ahead_count}](regular text)│▿┤[${behind_count}](regular text)│](italic pink)"
untracked = "[◌◦](italic yellow)"
stashed = "[◃◈](italic subtext0)"
modified = "[●◦](italic peach)"
staged = "[▪┤[${count}](bold text)│](italic teal)"
renamed = "[◎◦](italic blue)"
deleted = "[✕](italic red)"

[deno]
format = " [deno](italic) [ $version](green bold)"
version_format = "${raw}"

[lua]
format = " [lua](italic) [${symbol}${version}]($style)"
version_format = "${raw}"
symbol = " "
style = "bold yellow"

[nodejs]
format = " [󰎙 (italic)](bold green)"
version_format = "${raw}"
detect_files = ["package-lock.json", "yarn.lock"]
detect_folders = ["node_modules"]
detect_extensions = []
disabled = true

[bun]
format = " [bun](italic) [◫ ($version)](bold green)"
version_format = "${raw}"

[python]
format = " [py](italic) [${symbol}${version}]($style)"
symbol = "[⌉](bold sapphire)⌊ "
version_format = "${raw}"
style = "bold yellow"

[ruby]
format = " [rb](italic) [${symbol}${version}]($style)"
symbol = "◆ "
version_format = "${raw}"
style = "bold red"

[rust]
format = " [rs](italic) [$symbol$version]($style)"
symbol = " "
version_format = "${raw}"
style = "bold peach"

[package]
format = " [pkg](italic dimmed) [$symbol$version]($style)"
version_format = "${raw}"
symbol = "󰏖 "
style = "bold subtext0"

[swift]
format = " [sw](italic) [${symbol}${version}]($style)"
symbol = " "
style = "bold maroon"
version_format = "${raw}"

[aws]
disabled = true
format = " [aws](italic) [$symbol $profile $region]($style)"
style = "bold blue"
symbol = "▲ "

[buf]
symbol = "■ "
format = " [buf](italic) [$symbol $version $buf_version]($style)"

[c]
symbol = "ℂ "
format = " [$symbol($version(-$name))]($style)"

[cpp]
symbol = "ℂ "
format = " [$symbol($version(-$name))]($style)"

[conda]
symbol = "◯ "
format = " conda [$symbol$environment]($style)"

[pixi]
symbol = "■ "
format = " pixi [$symbol$version ($environment )]($style)"

[dart]
#symbol = "◁◅ "
symbol = " "
format = " dart [$symbol($version )]($style)"

[docker_context]
symbol = "◧ "
format = " docker [$symbol$context]($style)"

[elixir]
symbol = "△ "
format = " exs [$symbol $version OTP $otp_version ]($style)"

[elm]
#symbol = "◩ "
symbol = " "
format = " elm [$symbol($version )]($style)"

[golang]
#symbol = "∩ "
symbol = " "
style = "bold sky"
format = " go [$symbol($version )]($style)"

[haskell]
#symbol = "❯λ "
symbol = " "
format = " hs [$symbol($version )]($style)"

[java]
#symbol = "∪ "
symbol = ""
format = " java [${symbol}(${version} )]($style)"

[jj_bookmark]
format = " [$symbol$bookmark(@$remote)$diverged( \\(+$overflow_count others\\))]($style)"
symbol = "[△](bold italic sapphire)"
style = "italic sapphire"
truncation_symbol = "⋯"
truncation_length = 15
ignore_names = ["main", "master"]

[jj_metrics]
format = '([▴$added]($added_style))([▿$deleted]($deleted_style))'
added_style = 'italic green'
deleted_style = 'italic red'

[jj_status]
format = "([⎪$all⎥]($style))"
style = "bold italic lavender"
conflicted = "[◪◦](italic pink)"
description_empty = "[◌◦](italic pink)"
description_present = "[◦](italic pink)"
hidden = "[◦](italic pink)"
immutable = "[◦](italic pink)"
added = "[▪](italic teal)"
copied = "[◃◈](italic subtext0)"
deleted = "[✕](italic red)"
modified = "[●◦](italic peach)"
renamed = "[◎◦](italic blue)"

[julia]
#symbol = "◎ "
symbol = " "
format = " jl [$symbol($version )]($style)"

[memory_usage]
symbol = "▪▫▪ "
format = " mem [${ram}( ${swap})]($style)"

[nim]
#symbol = "▴▲▴ "
symbol = " "
format = " nim [$symbol($version )]($style)"

[nix_shell]
style = 'bold italic blue'
symbol = '✶'
format = '[$symbol⎪$state⎪]($style)'
impure_msg = '[⌽](bold red)'
pure_msg = '[⌾](bold green)'
unknown_msg = '[◌](bold yellow)'

[spack]
#symbol = "◇ "
symbol = " "
format = " spack [$symbol$environment]($style)"

[profiles]
transient = """($nix_shell$container$fill$git_metrics$cmd_duration)\n
$sudo\
$character
"""
path = """
$directory
"""
