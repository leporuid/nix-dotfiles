"$schema" = 'https://starship.rs/config-schema.json'

command_timeout = 1000
add_newline = false
continuation_prompt = "[▸▹ ](dimmed white)"
palette = "soft_violet_claude"

format = """($nix_shell$container$hostname\n)\
$sudo\
$character"""

# move the rest of the prompt to the right
right_format = """$all"""

[palettes.soft_violet_claude]
text = "#FCEAF3"
subtext1 = "#E8D5E6"
subtext0 = "#D8A7BE"
overlay2 = "#B88BA4"
overlay1 = "#7A6690"
overlay0 = "#43293A"
surface2 = "#7A6690"
surface1 = "#43293A"
surface0 = "#241320"
base = "#1C1025"
mantle = "#241320"
crust = "#170032"
mauve = "#B07FD0"
pink = "#FF85B8"
lavender = "#C8A2F0"
peach = "#FF9EBB"
red = "#E06C88"
maroon = "#D6447E"
yellow = "#FFD4A8"
green = "#8FBF9F"
teal = "#6DD5A8"
blue = "#8BB2D9"
sapphire = "#B8D4F0"
sky = "#B8D4F0"
rosewater = "#FFD4C4"
flamingo = "#FFB2D9"

[fill]
symbol = ' '

[character]
format = "$symbol "
success_symbol = "[◎](bold italic peach)"
error_symbol = "[⊘](italic red)"
vimcmd_symbol = "[■](italic green)"
vimcmd_replace_one_symbol = "◌"
vimcmd_replace_symbol = "□"
vimcmd_visual_symbol = "▼"

[env_var.VIMSHELL]
format = "[$env_value]($style)"
style = 'green italic'

[sudo]
format = "[$symbol]($style)"
style = "bold italic pink"
symbol = "⋈┈"
disabled = false

[username]
style_user = "yellow bold italic"
style_root = "mauve bold italic"
format = "[⭘ $user]($style) "
disabled = true
show_always = false

[hostname]
format = "[ $ssh_symbol]($style)"
ssh_symbol = ""

[directory]
home_symbol = "⌂ "
truncation_length = 3
fish_style_pwd_dir_length = 1                                                                                                                               # turn on fish directory truncation
truncation_symbol = "□ "
read_only = " ◈"
read_only_style = "pink"
use_os_path_sep = true
style = "italic peach"
format = '[$path]($style)[$read_only]($read_only_style)'
repo_root_style = 'bold flamingo'
repo_root_format = '[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) [△](bold pink)'

[directory.substitutions]
'/opt/homebrew' = ""
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "
'iCloud Drive' = "󰀸"

[cmd_duration]
format = "[◄ $duration ](italic flamingo)"
min_time = 2000
show_milliseconds = false
disabled = false

[jobs]
format = "[$symbol$number]($style) "
style = "text"
symbol = "[▶](blue italic)"

[localip]
ssh_only = true
format = " ◯[$localipv4](bold pink)"
disabled = true

[time]
disabled = true
format = "[ $time]($style)"
time_format = "%R"
utc_time_offset = "local"
style = "italic subtext0"

[battery]
format = "[ $percentage $symbol]($style)"
full_symbol = "█"
charging_symbol = "[↑](italic bold green)"
discharging_symbol = "↓"
unknown_symbol = "░"
empty_symbol = "▃"

[[battery.display]]
threshold = 20
style = "italic bold red"

[[battery.display]]
threshold = 60
style = "italic mauve"

[[battery.display]]
threshold = 70
style = "italic yellow"

[git_branch]
format = " [$symbol$branch(:$remote_branch)]($style)"
symbol = "[△](bold italic pink)"
style = "italic peach"
truncation_symbol = "⋯"
truncation_length = 15
ignore_branches = ["main", "master"]
only_attached = true

[git_metrics]
format = '([▴$added]($added_style))([▿$deleted]($deleted_style))'
added_style = 'italic green'
deleted_style = 'italic red'
ignore_submodules = true
disabled = false

[git_status]
style = "bold italic lavender"
format = "([⎪$ahead_behind$staged$modified$untracked$renamed$deleted$conflicted$stashed⎥]($style))"
conflicted = "[◪◦](italic pink)"
ahead = "[▴│[${count}](bold text)│](italic green)"
behind = "[▿│[${count}](bold text)│](italic red)"
diverged = "[◇ ▴┤[${ahead_count}](regular text)│▿┤[${behind_count}](regular text)│](italic pink)"
untracked = "[◌◦](italic yellow)"
stashed = "[◃◈](italic subtext0)"
modified = "[●◦](italic peach)"
staged = "[▪┤[${count}](bold text)│](italic teal)"
renamed = "[◎◦](italic blue)"
deleted = "[✕](italic red)"

[deno]
format = " [deno](italic) [ $version](green bold)"
version_format = "${raw}"

[lua]
format = " [lua](italic) [${symbol}${version}]($style)"
version_format = "${raw}"
symbol = " "
style = "bold yellow"

[nodejs]
format = " [󰎙 (italic)](bold green)"
version_format = "${raw}"
detect_files = ["package-lock.json", "yarn.lock"]
detect_folders = ["node_modules"]
detect_extensions = []
disabled = true

[bun]
format = " [bun](italic) [◫ ($version)](bold green)"
version_format = "${raw}"

[python]
format = " [py](italic) [${symbol}${version}]($style)"
symbol = "[⌉](bold sapphire)⌊ "
version_format = "${raw}"
style = "bold yellow"

[ruby]
format = " [rb](italic) [${symbol}${version}]($style)"
symbol = "◆ "
version_format = "${raw}"
style = "bold red"

[rust]
format = " [rs](italic) [$symbol$version]($style)"
symbol = " "
version_format = "${raw}"
style = "bold peach"

[package]
format = " [pkg](italic dimmed) [$symbol$version]($style)"
version_format = "${raw}"
symbol = "󰏖 "
style = "bold subtext0"

[swift]
format = " [sw](italic) [${symbol}${version}]($style)"
symbol = " "
style = "bold maroon"
version_format = "${raw}"

[aws]
disabled = true
format = " [aws](italic) [$symbol $profile $region]($style)"
style = "bold blue"
symbol = "▲ "

[buf]
symbol = "■ "
format = " [buf](italic) [$symbol $version $buf_version]($style)"

[c]
symbol = "ℂ "
format = " [$symbol($version(-$name))]($style)"

[cpp]
symbol = "ℂ "
format = " [$symbol($version(-$name))]($style)"

[conda]
symbol = "◯ "
format = " conda [$symbol$environment]($style)"

[pixi]
symbol = "■ "
format = " pixi [$symbol$version ($environment )]($style)"

[dart]
#symbol = "◁◅ "
symbol = " "
format = " dart [$symbol($version )]($style)"

[docker_context]
symbol = "◧ "
format = " docker [$symbol$context]($style)"

[elixir]
symbol = "△ "
format = " exs [$symbol $version OTP $otp_version ]($style)"

[elm]
#symbol = "◩ "
symbol = " "
format = " elm [$symbol($version )]($style)"

[golang]
#symbol = "∩ "
symbol = " "
style = "bold sky"
format = " go [$symbol($version )]($style)"

[haskell]
#symbol = "❯λ "
symbol = " "
format = " hs [$symbol($version )]($style)"

[java]
#symbol = "∪ "
symbol = ""
format = " java [${symbol}(${version} )]($style)"

[jj_bookmark]
format = " [$symbol$bookmark(@$remote)$diverged( \\(+$overflow_count others\\))]($style)"
symbol = "[△](bold italic pink)"
style = "italic peach"
truncation_symbol = "⋯"
truncation_length = 15
ignore_names = ["main", "master"]

[jj_metrics]
format = '([▴$added]($added_style))([▿$deleted]($deleted_style))'
added_style = 'italic green'
deleted_style = 'italic red'

[jj_status]
format = "([⎪$all⎥]($style))"
style = "bold italic lavender"
conflicted = "[◪◦](italic pink)"
description_empty = "[◌◦](italic pink)"
description_present = "[◦](italic pink)"
hidden = "[◦](italic pink)"
immutable = "[◦](italic pink)"
added = "[▪](italic teal)"
copied = "[◃◈](italic subtext0)"
deleted = "[✕](italic red)"
modified = "[●◦](italic peach)"
renamed = "[◎◦](italic blue)"

[julia]
#symbol = "◎ "
symbol = " "
format = " jl [$symbol($version )]($style)"

[memory_usage]
symbol = "▪▫▪ "
format = " mem [${ram}( ${swap})]($style)"

[nim]
#symbol = "▴▲▴ "
symbol = " "
format = " nim [$symbol($version )]($style)"

[nix_shell]
style = 'bold italic blue'
symbol = '✶'
format = '[$symbol⎪$state⎪]($style)'
impure_msg = '[⌽](bold red)'
pure_msg = '[⌾](bold green)'
unknown_msg = '[◌](bold yellow)'

[spack]
#symbol = "◇ "
symbol = " "
format = " spack [$symbol$environment]($style)"

[profiles]
transient = """($nix_shell$container$fill$git_metrics$cmd_duration)\n
$sudo\
$character
"""
path = """
$directory
"""

# Nushell keeps every prompt row in scrollback (there is no transient prompt),
# so give it a single-line prompt to keep the transcript as compact as Fish's.
nu = "($nix_shell$container$hostname)$sudo$character"
